<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Transformation Tracker</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --card2:#1e222b;
    --accent:#ff5b2e;
    --accent2:#2ecc71;
    --text:#eef0f3;
    --muted:#8a90a0;
    --border:#2a2f3a;
    --danger:#ff4d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    padding:24px 16px 12px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:22px;
    letter-spacing:0.5px;
  }
  header p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:13px;
  }
  .container{
    max-width:640px;
    margin:0 auto;
    padding:0 16px;
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:18px 0;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 8px;
    text-align:center;
  }
  .stat .num{
    font-size:22px;
    font-weight:700;
    color:var(--accent);
  }
  .stat .label{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .date-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:16px;
  }
  .date-nav button{
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:8px 12px;
    cursor:pointer;
    font-size:14px;
  }
  .date-nav .cur-date{
    font-weight:600;
    font-size:15px;
    text-align:center;
  }
  .date-nav .cur-date small{
    display:block;
    color:var(--muted);
    font-weight:400;
    font-size:11px;
    margin-top:2px;
  }
  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    margin:20px 0 10px;
  }
  .task{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:8px;
  }
  .task.done{
    border-color:var(--accent2);
    background:linear-gradient(90deg, rgba(46,204,113,0.08), transparent);
  }
  .task input[type=checkbox]{
    width:20px;
    height:20px;
    accent-color:var(--accent2);
    flex-shrink:0;
    cursor:pointer;
  }
  .task .txt{
    flex:1;
    font-size:14.5px;
  }
  .task.done .txt{
    text-decoration:line-through;
    color:var(--muted);
  }
  .task .del{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:4px 6px;
  }
  .task .del:hover{ color:var(--danger); }
  .empty{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:20px 0;
  }
  .add-row{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .add-row input{
    flex:1;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-size:14px;
  }
  .add-row button{
    background:var(--accent);
    border:none;
    color:#fff;
    border-radius:10px;
    padding:11px 16px;
    font-weight:600;
    cursor:pointer;
    font-size:14px;
  }
  .notes textarea{
    width:100%;
    min-height:80px;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:12px;
    padding:12px;
    font-family:inherit;
    font-size:14px;
    resize:vertical;
  }
  .metrics{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .metric-field{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
  }
  .metric-field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .metric-field input{
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:15px;
  }
  .metric-field input:focus{ outline:none; }
  .history{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
  }
  .day-chip{
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--muted);
    cursor:pointer;
  }
  .day-chip.full{ background:var(--accent2); color:#0a1c10; border-color:var(--accent2); font-weight:700;}
  .day-chip.partial{ background:#5a4a1e; color:#ffd27a; border-color:#6b591f;}
  .day-chip.today{ box-shadow:0 0 0 2px var(--accent); }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    margin-top:30px;
  }
  .presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .preset-btn{
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:20px;
    padding:6px 12px;
    font-size:12px;
    cursor:pointer;
  }
  .toolbar{
    display:flex;
    gap:8px;
    margin:10px 0 4px;
  }
  .toolbar button{
    flex:1;
    background:var(--card2);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:10px;
    padding:9px;
    font-size:12.5px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🔥 Transformation Tracker</h1>
  <p>Track your daily routine, workouts & progress — 100% offline</p>
</header>

<div class="container">

  <div class="stats">
    <div class="stat"><div class="num" id="streakNum">0</div><div class="label">Day Streak</div></div>
    <div class="stat"><div class="num" id="totalDays">0</div><div class="label">Days Logged</div></div>
    <div class="stat"><div class="num" id="todayPct">0%</div><div class="label">Today</div></div>
  </div>

  <div class="date-nav">
    <button onclick="changeDay(-1)">‹ Prev</button>
    <div class="cur-date">
      <span id="curDateLabel">Today</span>
      <small id="curDateSub"></small>
    </div>
    <button onclick="changeDay(1)" id="nextBtn">Next ›</button>
  </div>

  <div class="section-title">Today's Routine</div>
  <div class="presets" id="presets"></div>
  <div id="taskList"></div>
  <div class="add-row">
    <input type="text" id="newTaskInput" placeholder="Add a task e.g. Leg day, Drink 3L water..." onkeydown="if(event.key==='Enter')addTask()">
    <button onclick="addTask()">Add</button>
  </div>

  <div class="section-title">Body Metrics (optional)</div>
  <div class="metrics">
    <div class="metric-field">
      <label>Weight (kg)</label>
      <input type="number" step="0.1" id="mWeight" oninput="saveMetrics()">
    </div>
    <div class="metric-field">
      <label>Water (L)</label>
      <input type="number" step="0.1" id="mWater" oninput="saveMetrics()">
    </div>
    <div class="metric-field">
      <label>Sleep (hrs)</label>
      <input type="number" step="0.5" id="mSleep" oninput="saveMetrics()">
    </div>
    <div class="metric-field">
      <label>Calories</label>
      <input type="number" id="mCalories" oninput="saveMetrics()">
    </div>
  </div>

  <div class="section-title">Notes / Journal</div>
  <div class="notes">
    <textarea id="notesArea" placeholder="How did today go? Energy, mood, PRs, cravings..." oninput="saveNotes()"></textarea>
  </div>

  <div class="section-title">Last 28 Days</div>
  <div class="history" id="historyGrid"></div>

  <div class="toolbar">
    <button onclick="exportData()">⬇ Export Backup</button>
    <button onclick="document.getElementById('importFile').click()">⬆ Import Backup</button>
    <button onclick="resetToday()">↺ Clear Today</button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">

  <footer>Data is stored only in this browser (localStorage). Nothing is uploaded. Export a backup regularly.</footer>
</div>

<script>
// ---------- Storage helpers ----------
const STORE_KEY = 'transformationTrackerData';

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : { days: {}, presets: null };
  }catch(e){
    return { days: {}, presets: null };
  }
}
function saveStore(){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

let store = loadStore();

const DEFAULT_PRESETS = ["Warmup", "Workout", "Drink Water", "Protein Meal", "10k Steps", "Sleep 7-8 hrs"];
if(!store.presets) store.presets = DEFAULT_PRESETS.slice();

// ---------- Date handling ----------
function fmtKey(d){
  return d.toISOString().slice(0,10); // YYYY-MM-DD
}
function todayDate(){
  const d = new Date();
  d.setHours(0,0,0,0);
  return d;
}

let viewDate = todayDate();

function isToday(d){
  return fmtKey(d) === fmtKey(todayDate());
}

function changeDay(delta){
  const nd = new Date(viewDate);
  nd.setDate(nd.getDate() + delta);
  if(nd > todayDate()) return; // can't go into the future
  viewDate = nd;
  render();
}

function getDayData(key){
  if(!store.days[key]){
    store.days[key] = { tasks: [], notes: "", metrics: {} };
  }
  return store.days[key];
}

// ---------- Tasks ----------
function addTask(text){
  const input = document.getElementById('newTaskInput');
  const value = (text || input.value).trim();
  if(!value) return;
  const key = fmtKey(viewDate);
  const day = getDayData(key);
  day.tasks.push({ id: Date.now() + Math.random(), text: value, done: false });
  saveStore();
  input.value = '';
  render();
}

function toggleTask(id){
  const key = fmtKey(viewDate);
  const day = getDayData(key);
  const t = day.tasks.find(t => t.id === id);
  if(t) t.done = !t.done;
  saveStore();
  render();
}

function deleteTask(id){
  const key = fmtKey(viewDate);
  const day = getDayData(key);
  day.tasks = day.tasks.filter(t => t.id !== id);
  saveStore();
  render();
}

function resetToday(){
  if(!confirm('Clear all tasks, notes and metrics for this day?')) return;
  const key = fmtKey(viewDate);
  store.days[key] = { tasks: [], notes: "", metrics: {} };
  saveStore();
  render();
}

// ---------- Notes & metrics ----------
function saveNotes(){
  const key = fmtKey(viewDate);
  const day = getDayData(key);
  day.notes = document.getElementById('notesArea').value;
  saveStore();
}

function saveMetrics(){
  const key = fmtKey(viewDate);
  const day = getDayData(key);
  day.metrics = {
    weight: document.getElementById('mWeight').value,
    water: document.getElementById('mWater').value,
    sleep: document.getElementById('mSleep').value,
    calories: document.getElementById('mCalories').value
  };
  saveStore();
}

// ---------- Presets ----------
function renderPresets(){
  const el = document.getElementById('presets');
  el.innerHTML = '';
  store.presets.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = '+ ' + p;
    btn.onclick = () => addTask(p);
    el.appendChild(btn);
  });
}

// ---------- Streak & stats ----------
function dayCompletion(key){
  const day = store.days[key];
  if(!day || day.tasks.length === 0) return null;
  const done = day.tasks.filter(t => t.done).length;
  return done / day.tasks.length;
}

function computeStreak(){
  let streak = 0;
  let d = todayDate();
  while(true){
    const key = fmtKey(d);
    const pct = dayCompletion(key);
    if(pct !== null && pct >= 1) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else if (pct !== null && pct > 0 && fmtKey(d) === fmtKey(todayDate())) {
      // today partially done still counts as "in progress", don't break streak yet
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function computeTotalDays(){
  return Object.keys(store.days).filter(k => store.days[k].tasks.length > 0).length;
}

// ---------- Render ----------
function render(){
  renderPresets();

  const key = fmtKey(viewDate);
  const day = getDayData(key);

  document.getElementById('curDateLabel').textContent = isToday(viewDate)
    ? 'Today'
    : viewDate.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  document.getElementById('curDateSub').textContent = viewDate.toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
  document.getElementById('nextBtn').disabled = isToday(viewDate);
  document.getElementById('nextBtn').style.opacity = isToday(viewDate) ? 0.4 : 1;

  const list = document.getElementById('taskList');
  list.innerHTML = '';
  if(day.tasks.length === 0){
    list.innerHTML = '<div class="empty">No tasks yet. Add your routine above 👆</div>';
  } else {
    day.tasks.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task' + (t.done ? ' done' : '');
      row.innerHTML = `
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${JSON.stringify(t.id)})">
        <div class="txt">${escapeHtml(t.text)}</div>
        <button class="del" onclick="deleteTask(${JSON.stringify(t.id)})">✕</button>
      `;
      list.appendChild(row);
    });
  }

  document.getElementById('notesArea').value = day.notes || '';
  document.getElementById('mWeight').value = day.metrics.weight || '';
  document.getElementById('mWater').value = day.metrics.water || '';
  document.getElementById('mSleep').value = day.metrics.sleep || '';
  document.getElementById('mCalories').value = day.metrics.calories || '';

  const pct = day.tasks.length ? Math.round(day.tasks.filter(t=>t.done).length / day.tasks.length * 100) : 0;
  document.getElementById('todayPct').textContent = pct + '%';
  document.getElementById('streakNum').textContent = computeStreak();
  document.getElementById('totalDays').textContent = computeTotalDays();

  renderHistory();
}

function renderHistory(){
  const grid = document.getElementById('historyGrid');
  grid.innerHTML = '';
  const days = [];
  for(let i = 27; i >= 0; i--){
    const d = new Date(todayDate());
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  days.forEach(d => {
    const key = fmtKey(d);
    const pct = dayCompletion(key);
    const chip = document.createElement('div');
    chip.className = 'day-chip';
    if(pct !== null && pct >= 1) chip.classList.add('full');
    else if(pct !== null && pct > 0) chip.classList.add('partial');
    if(fmtKey(d) === fmtKey(todayDate())) chip.classList.add('today');
    chip.textContent = d.getDate();
    chip.title = d.toLocaleDateString();
    chip.onclick = () => { viewDate = d; render(); };
    grid.appendChild(chip);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Backup / restore ----------
function exportData(){
  const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'transformation-tracker-backup-' + fmtKey(todayDate()) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.days) throw new Error('Invalid file');
      if(!confirm('This will merge/overwrite your current data with the backup. Continue?')) return;
      store = { days: { ...store.days, ...imported.days }, presets: imported.presets || store.presets };
      saveStore();
      render();
      alert('Backup restored successfully.');
    }catch(err){
      alert('Could not read this file. Make sure it is a valid backup exported from this app.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ---------- Init ----------
render();
</script>

</body>
</html>
